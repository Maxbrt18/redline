[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# The engine installs as the `redline` package, editable (`pip install --no-deps -e .`):
# the checkout stays the code that runs. Its pinned dependencies live in
# server/requirements.txt, which the runtime updater installs into the service venv.
[project]
name = "redline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.css", "*.js", "*.html", "*.json", "*.toml", "*.txt", "*.png", "*.woff2"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = []

[tool.ruff.lint]
# UP, PIE et FURB depuis le 2026-09-28 : une syntaxe, pas deux (`X | None` et non
# `Optional[X]`), et les tournures que la bibliothèque standard fait déjà mieux.
select = ["E", "W", "F", "I", "B", "SIM", "C4", "RUF", "UP", "PIE", "FURB"]
ignore = [
    # Long URLs and regexes in the middle of a rule are not worth a backslash.
    "E501",
    # RUF001-003 flag French typography (— « » ’ °) as "ambiguous unicode". Every
    # string the athlete reads is French, so this fires ~44 times on correct code.
    "RUF001", "RUF002", "RUF003",
    # `class X(str, Enum)` -> StrEnum changerait str(x), donc le texte des incidents.
    "UP042",
    # Syntaxe PEP 695 (`type X = ...`, génériques) : aucun gain ici, et mypy la lit
    # encore moins bien que TypeAlias/TypeVar.
    "UP040", "UP047",
]

[tool.ruff.lint.isort]
known-first-party = ["redline"]

[tool.ruff.lint.per-file-ignores]
# Test names are sentences on purpose (test_a_view_is_replaced_between_its_markers).
"tests/*" = ["E741"]

[tool.vulture]
# Le code de production seul : les tests n'entrent pas dans l'analyse, donc une
# fonction que seul son propre test appelle est signalée comme morte (2026-09-28 :
# une quinzaine en vivaient ainsi). Un faux positif se déclare ici, nommé.
paths = ["src", "server/codex-runtime-smoke.py", "server/claude-runtime-smoke.py",
         "server/agent-runtime-update.py"]
exclude = ["*/tests/*"]
min_confidence = 60
# Routes Flask : appelées par le framework, jamais par le code.
ignore_decorators = ["@app.get", "@app.post", "@app.before_request", "@app.after_request", "@app.errorhandler"]
ignore_names = [
    # Chargement paresseux du paquet `redline.storage` (PEP 562).
    "__getattr__",
    # Déclaration des déclencheurs que la base doit porter, vérifiée contre elle.
    "TRIGGERS",
    # Porteur nommé de chaque règle du règlement compilé (CLAUDE.md, « une règle
    # générale nomme son porteur ») : une donnée, pas un appel.
    "enforced_by",
    # Seuils du règlement que seul le texte d'une règle cite (`{pain_cap}`), lus par
    # `Parameters.spoken` : le code n'en applique pas, le coach si.
    "gate_trend_weeks", "pain_cap",
    # Réglage Flask lu par Werkzeug.
    "max_content_length",
    # Champs d'`Activity` que seul `summary()` lit, par `dataclasses.fields`.
    "relative_effort", "calories",
]

[tool.mypy]
# Added after a real outage: `_buffer_proactive_retry` was CALLED in bot.py without
# existing for eleven days, and the Sunday review crashed instead of being deferred.
# Neither ruff nor the tests see a missing method on `self`; mypy names it.
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No stubs published, and the import is already guarded at the call site.
module = ["waitress", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` for conftest helpers; `src` so the suite runs without an install.
pythonpath = ["tests", "src"]
