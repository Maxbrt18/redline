# Configuration d'une instance Redline. À copier à la racine du vault sous le nom
# `redline.toml`, puis à remplir : le service refuse de démarrer tant qu'une valeur
# entre crochets reste telle quelle.

[athlete]
# Le prénom que le coach emploie dans ses messages.
name = "[Prénom]"

[notebook]
# Le lieu de la météo des séances qui n'en déclarent pas (geocodage Open-Meteo).
place = "[Ville]"

# Les zones que le coach surveille, une par bloc : la douleur se note et se suit zone
# par zone, jamais mélangée. Sans bloc [[injuries]], aucune. Le slug est l'identité
# stable de la zone en base ; le libellé, ce que le carnet et les messages affichent.
# [[injuries]]
# slug = "genou"
# label = "Genou"
#
# [[injuries]]
# slug = "cheville"
# label = "Cheville"

# Les capacités que le cockpit suit, dans l'ordre d'affichage. Le slug est celui que
# `fact-write.py capability` enregistre ; le libellé est ce que le carnet affiche.
[[capabilities]]
slug = "cap1-durabilite"
label = "Durabilité"

[[capabilities]]
slug = "cap2-descente"
label = "Descente"
