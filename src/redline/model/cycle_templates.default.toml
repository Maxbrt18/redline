qualities = 0
long_run_share_max = 0.25
min_held_km = 20

# ------------------------------------------------------------------ recovery and rebuild
#
# After a race, by its distance: the first days without a quality session, then a volume
# coming back within its band. These lengths are conventions, sourced at the transitions;
# a recovery is lengthened while pain or the morning trace stays above its base.

[[recovery]]
distance_km_max = 15
weeks = [1, 1]
no_quality_days = 5
volume_pct = [50, 70]

[[recovery]]
distance_km_max = 25
weeks = [1, 2]
no_quality_days = 7
volume_pct = [40, 60]

[[recovery]]
distance_km_max = 45
weeks = [2, 3]
no_quality_days = 10
volume_pct = [30, 50]

[[recovery]]
distance_km_max = 400
weeks = [3, 4]
no_quality_days = 14
volume_pct = [20, 40]

# After a break, from half of the highest volume held (decided), at most 10 % a week.
[[rebuild]]
floor_pct = 50
ramp_max_pct = 10
