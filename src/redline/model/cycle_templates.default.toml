# The engine's cycle templates, version 2: the method each kind of training cycle
# follows (`redline.model.cycle_templates`). An instance's `cycle_templates.toml` at its
# vault root replaces this file as a whole.
#
# A template is a method, never an athlete's plan: volumes are shares of the highest
# weekly volume the athlete held, intensities bands around a reference (% of its speed for
# a speed reference, the 1-10 scale for rpe). Where a value comes from the literature, its
# source is named; the others are conventions of the method, to check against what the
# athlete answers.
#
# Sources:
# - taper: 41 to 60 % of volume over 8 to 14 days, frequency and intensity kept (Bosquet
#   et al. 2007; Wang et al. 2023); 14 to 21 days before a marathon;
# - critical speed: the upper limit of a threshold session, the heavy domain below it
#   (Jones et al. 2019); the first threshold near 82 % of CS (Hunter et al. 2024);
# - general preparation: at least one first-threshold session a week, started easy, 20 to
#   30 % in reserve; volume at 70 to 80 % of the highest held for higher-volume runners,
#   at it for low-volume ones; short long run; deloads in blocks of 2 to 4 days rather
#   than weeks; a domain of at least 40 to 50 km a week (RunWise, a single author; the
#   elite review of Casado et al. 2022 describes two quality sessions a week instead);
# - long run: at most 25 to 30 % of the week's volume (Daniels, Running Formula).
version = 2
default_level = "maintain"

# ------------------------------------------------------------------ preparations
#
# The window before the race: development, specific block, taper. The weeks before it are
# the general preparation. Deloads are scheduled every 3 to 4 weeks and cut a quarter of
# the week (a convention of linear plans). A candidate's peak never exceeds 120 % of the
# highest weekly volume held (a convention: lost weeks are never caught up).

[[preparation]]
slug = "short-road"
terrain = "road"
distance_km_max = 15
taper_weeks = 2
taper_cut_pct = [41, 60]
deload_mode = "scheduled"
deload_every_weeks = [3, 4]
deload_cut_pct = 25
phases = ["development", "specific", "taper"]
window_weeks = [7, 12]
min_held_km = 30
peak_pct_of_held = 120
long_run_km_max = 16

[preparation.development]
weeks = [4, 6]
long_run_share_max = 0.30
qualities = 2

  [[preparation.development.key]]
  workout = "threshold"
  intensity = { ref = "critical_speed", band = [90, 95] }
  start = { reps = 3, rep_seconds = 360, recovery_seconds = 90 }
  arrival = { reps = 5, rep_seconds = 480, recovery_seconds = 60 }
  step = { reps = 1, rep_seconds = 60, recovery_seconds = 15 }

  [[preparation.development.key]]
  workout = "hills"
  intensity = { ref = "rpe", band = [7, 8] }
  start = { reps = 6, rep_seconds = 45, recovery_seconds = 120 }
  arrival = { reps = 10, rep_seconds = 60, recovery_seconds = 120 }
  step = { reps = 1, rep_seconds = 15, recovery_seconds = 15 }

[preparation.specific]
weeks = [3, 5]
long_run_share_max = 0.30
qualities = 2

  [[preparation.specific.key]]
  workout = "race-pace"
  intensity = { ref = "goal_pace", band = [99, 101] }
  start = { reps = 5, rep_seconds = 180, recovery_seconds = 90 }
  arrival = { reps = 5, rep_seconds = 300, recovery_seconds = 90 }
  step = { reps = 1, rep_seconds = 60, recovery_seconds = 15 }
  flagship = 2

  [[preparation.specific.key]]
  workout = "threshold"
  intensity = { ref = "critical_speed", band = [92, 97] }
  start = { reps = 4, rep_seconds = 480, recovery_seconds = 60 }
  arrival = { reps = 3, rep_seconds = 720, recovery_seconds = 60 }
  step = { reps = 1, rep_seconds = 120, recovery_seconds = 15 }

[preparation.taper]
qualities = 1

  [[preparation.taper.key]]
  workout = "race-pace"
  intensity = { ref = "goal_pace", band = [99, 101] }
  start = { reps = 4, rep_seconds = 180, recovery_seconds = 90 }
  arrival = { reps = 3, rep_seconds = 120, recovery_seconds = 90 }
  step = { reps = 1, rep_seconds = 60, recovery_seconds = 15 }

