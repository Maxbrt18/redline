# ------------------------------------------------------------------ general preparation
#
# One quality session a week at every level (RunWise, decided over the elite practice),
# the first threshold started easy. Deloads are triggered blocks of 2 to 4 days, outside
# the trame. A version covers a block of 4 weeks (O6).

[[general]]
level = "maintain"
deload_mode = "triggered"
deload_days = [2, 4]
block_weeks = 4
volume_pct = [70, 80]
band_from_km = 40
qualities = 1
long_run_share_max = 0.25
min_held_km = 40

  [[general.key]]
  workout = "threshold"
  intensity = { ref = "first_threshold", band = [95, 100] }
  start = { reps = 3, rep_seconds = 480, recovery_seconds = 60 }
  arrival = { reps = 3, rep_seconds = 720, recovery_seconds = 60 }
  step = { reps = 1, rep_seconds = 120, recovery_seconds = 15 }

[[general]]
level = "progress"
deload_mode = "triggered"
deload_days = [2, 4]
block_weeks = 4
volume_pct = [80, 100]
band_from_km = 40
qualities = 1
long_run_share_max = 0.25
min_held_km = 40
ramp_max_pct = 8

  [[general.key]]
  workout = "threshold"
  intensity = { ref = "first_threshold", band = [95, 100] }
  start = { reps = 3, rep_seconds = 480, recovery_seconds = 60 }
  arrival = { reps = 4, rep_seconds = 720, recovery_seconds = 60 }
  step = { reps = 1, rep_seconds = 120, recovery_seconds = 15 }

