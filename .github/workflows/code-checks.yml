# The conventions of pyproject.toml only hold while something runs them. Three jobs: the
# gate (lint, types, dead code, shell scripts, schema, tests), the same tests under the
# service role, and the pages (the PNG cards and the notebook, in Chromium), which need a
# browser the gate does without.
name: Code checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/code-checks.yml"
      - ".python-version"
      - ".githooks/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "migrations/**"
      - "deploy/**"
      - "requirements*.txt"
      - "src/**"
      - "templates/**"
      - "tests/**"
  pull_request:
  workflow_dispatch:

# One run per branch: a push that follows another cancels the previous run instead of
# queueing behind a Chromium job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Shows up as "Code checks / ruff · mypy · pytest" next to a commit, so the gate's
    # coverage is visible without opening it.
    name: ruff · mypy · pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: redline-test
          POSTGRES_DB: redline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:redline-test@localhost:5432/redline_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      # Without the `cards` extra: Playwright and its Chromium belong to the pages job.
      - name: Install
        run: |
          python -m pip install --quiet -c requirements.txt -c requirements-dev.txt \
                                        -e '.[codex,dev,route]'

      - name: Shell scripts
        run: |
          shellcheck .githooks/pre-commit templates/vault/.githooks/pre-commit \
                     deploy/agent-cli/redline-agent-cli deploy/postgres/*.sh

      - name: Database schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy

      # Production code only (config in pyproject.toml): a function that only its own
      # test calls is dead, and the build says so.
      - name: Dead code
        run: python -m vulture

      - name: Tests
        # -rs prints WHY anything skipped: a module that skips itself for a missing
        # dependency otherwise reads as a passing build.
        run: python -m pytest -q -rs

  service-role:
    # The gate is a superuser, whom no privilege ever stops. Here the roles are the real
    # ones: the migrator creates the schema and the tests use the service's rights.
    name: pytest as redline_app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: redline-test
          POSTGRES_DB: redline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d redline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://redline_app:app-test@localhost:5432/redline
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:redline-test@localhost:5432/redline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install
        run: |
          python -m pip install --quiet -c requirements.txt -c requirements-dev.txt \
                                        -e '.[codex,dev,route]'

      - name: Roles
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: redline
          PGHOST: localhost
          PGPASSWORD: redline-test
        run: |
          sudo mkdir -p /run/secrets
          printf app-test | sudo tee /run/secrets/postgres_app_password > /dev/null
          printf migrator-test | sudo tee /run/secrets/postgres_migrator_password > /dev/null
          bash deploy/postgres/init-roles.sh

      - name: Database schema
        env:
          DATABASE_URL: postgresql+psycopg://redline_migrator:migrator-test@localhost:5432/redline
        run: alembic upgrade head

      - name: Tests
        run: python -m pytest -q -rs

  pages:
    name: cards · notebook (Chromium)
    # Pinned: Playwright installs Chromium's system libraries only on the Ubuntu
    # releases it supports, which `ubuntu-latest` can outrun.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install
        run: |
          python -m pip install --quiet -c requirements.txt -c requirements-dev.txt \
                                        -e '.[cards,dev]'
          python -m playwright install --with-deps chromium

      - name: Pages
        run: python -m pytest -q -rs tests/test_charts.py tests/test_page.py tests/test_notebook_page.py
